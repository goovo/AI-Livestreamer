[project]
name = "goovo-human"
version = "0.1.0"
description = "口播数字人智能体：LLM 撰稿 + 神经语音 + 双视频形象 + 视频号 RTMP 推流"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mediapipe>=1.2.3",
    "pypinyin>=0.55.0",
    "numpy>=2.4.6",
]

[project.scripts]
goovo = "goovo_human.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goovo_human"]
